<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = originalFetch;
          var propDesc = {
            get: function () {
              return _currentFetch;
            },
            set: function (newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(window, 'fetch', propDesc);
          } catch (e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', propDesc);
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
